<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SynchroNice</title>
    <link rel="stylesheet" href="/ui/styles.css" />
    <script type="module" src="/ui/main.ts"></script>
  </head>
  <body>
    <header class="chat-header">
      <button
        id="clear-all"
        class="settings-toggle"
        type="button"
        aria-label="Apagar tudo"
        title="Apagar tudo"
        hidden
      >
        🗑
      </button>
      <button
        id="settings-toggle"
        class="settings-toggle"
        type="button"
        aria-label="Configurações"
        aria-expanded="false"
        aria-controls="settings-panel"
        title="Configurações"
      >
        ⚙
      </button>
      <div id="settings-panel" class="settings-panel" aria-label="Configurações" hidden>
        <button id="change-folder" type="button">Mudar pasta…</button>
        <button id="unpair" type="button">Desparear</button>
        <label class="settings-option">
          <input id="copy-with-punctuation" type="checkbox" />
          <span>Copiar com pontuação</span>
        </label>
      </div>
    </header>
    <div id="qr-screen" hidden>
      <div class="qr-svg"></div>
      <b>Escaneie no celular</b>
      <span>Abra o SynchroNice no celular e aponte a câmera para o QR.</span>
    </div>
    <div id="frame" hidden>
      <div class="scroll">
        <div class="empty">
          <b>Nada aqui ainda</b>
          Compartilhe algo do celular, ou arraste um arquivo.
        </div>
      </div>
      <ul id="bandeja" aria-label="Arquivos para enviar" hidden></ul>
      <div id="aviso-apagar" class="aviso-apagar" role="status" hidden>
        <span class="aviso-texto"></span>
        <button id="desfazer" type="button">Desfazer</button>
        <div class="aviso-barra"></div>
      </div>
      <div id="erro-apagar" class="aviso-apagar" role="alert" hidden>
        <span>Não foi possível apagar a conversa.</span>
        <button id="tentar-apagar" type="button">Tentar novamente</button>
      </div>
      <div class="composer">
        <span class="presenca" id="presenca" data-online="false"></span>
        <input id="composer-input" placeholder="texto para o celular…" autocomplete="off" />
        <span class="hint">Enter envia · arraste ou Ctrl+V</span>
        <button class="send" type="button" aria-label="Enviar">➤</button>
      </div>
    </div>
  </body>
</html>
