<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SynchroNice</title>
    <link rel="stylesheet" href="/ui/styles.css" />
    <script type="module" src="/ui/main.ts"></script>
  </head>
  <body>
    <div id="frame">
      <div class="scroll">
        <div class="empty">
          <b>Nada aqui ainda</b>
          Compartilhe algo do celular, ou arraste um arquivo.
        </div>
      </div>
      <div class="composer">
        <input id="composer-input" placeholder="texto para o celular…" autocomplete="off" disabled />
        <span class="hint">Enter envia · arraste ou Ctrl+V</span>
        <button class="send" disabled>➤</button>
      </div>
    </div>
  </body>
