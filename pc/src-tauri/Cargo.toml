[package]
name = "pc"
version = "0.1.0"
description = "SynchroNice — app do PC"
authors = ["Bruno"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "fs", "io-util", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
# Lista de arquivos do clipboard do Windows (Ctrl+V de arquivo copiado no
# Explorer, CF_HDROP) — formato que a Clipboard API da web não expõe.
clipboard-win = "5"
# Anúncio do serviço na rede local (SYN-005): sem daemon do sistema, funciona
# no Windows sem instalar Bonjour.
mdns-sd = { version = "0.21", default-features = false }
# QR de pareamento (SYN-005), renderizado como SVG.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Arrastar o arquivo de uma bolha para outro programa (SYN-006): drag nativo
# do SO a partir do WebView, que a Drag and Drop API da web não faz.
tauri-plugin-drag = "2"

[dev-dependencies]
tempfile = "3"
ureq = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
