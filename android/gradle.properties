# Sem daemon: o daemon herda o stdout do gate e segura o pipe aberto depois do
# build, e a chamada do agente espera até o timeout de 600s -- foi isso que
# matou os reviews que "rodaram o gate em segundo plano".
org.gradle.daemon=false

# O dex do app (Compose + CameraX) estoura os 512 MB padrao do Gradle.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
